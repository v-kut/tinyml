version = 1
SPDX-PackageName = "tinyml-racing"
SPDX-PackageSupplier = "https://github.com/v-kut/tinyml"

# This subtree is self-contained: it ships its own `LICENSES/` so that
# `reuse lint` passes when the directory is extracted on its own, and it also
# lints correctly as part of the parent coursework repository.

# Everything written for this project: Python package, sketch, tests, docs,
# config. `override` because the repository root declares CC-BY-NC for docs and
# CC0 for config, while this subtree is uniformly MIT.
[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Vsevolod Kutsyn <vkutsyn@uw.edu>"
SPDX-License-Identifier = "MIT"

# Third-party papers and course handouts kept for reference; not ours to
# relicense.
[[annotations]]
path = "docs/materials/**"
precedence = "override"
SPDX-FileCopyrightText = "respective copyright holders"
SPDX-License-Identifier = "LicenseRef-third-party-reference"
